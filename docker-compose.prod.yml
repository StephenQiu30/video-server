name: stephen-video-prod

services:
  # Infrastructure (Inherited and potentially customized)
  db:
    extends:
      file: docker-compose.yml
      service: db
  
  redis:
    extends:
      file: docker-compose.yml
      service: redis

  minio:
    extends:
      file: docker-compose.yml
      service: minio

  # Application Services
  api:
    build:
      context: .
      target: api
    container_name: stephen-video-api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@db:5432/${POSTGRES_DB:-video_downloader}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    container_name: stephen-video-worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@db:5432/${POSTGRES_DB:-video_downloader}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    container_name: stephen-video-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
