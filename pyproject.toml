[project]
name = "video-server"
version = "0.1.0"
description = "Authorized video source resolution and knowledge workflow server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.18.5,<2",
  "celery[redis]>=5.6.3,<6",
  "email-validator==2.3.0",
  "fastapi>=0.139.2,<1",
  "fastapi-users==15.0.5",
  "fastapi-users-db-sqlalchemy==7.0.0",
  "httpx>=0.28,<1",
  "idna>=3.10,<4",
  "jsonschema>=4.24,<5",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]==0.3.0",
  "pynacl>=1.5,<2",
  "redis>=6.4,<7",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0.51,<2.1",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2025.6,<2027",
]

[dependency-groups]
dev = [
  "check-jsonschema>=0.33,<1",
  "freezegun>=1.5,<2",
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers[postgres,redis]>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_server"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "canary: external production canary tests",
  "contract: HTTP and schema contract tests",
  "integration: service integration tests",
  "performance: performance acceptance tests",
  "policy: signed policy lifecycle tests",
  "retention: data retention clock tests",
  "security: security boundary tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["video_server"]

[tool.coverage.run]
branch = true
source = ["video_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
