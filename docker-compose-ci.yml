# CI-only network and endpoint overrides.
# The normal business Compose intentionally reaches host-managed services via
# host.docker.internal. CI starts the infrastructure services in the same
# Compose project, so the smoke test uses their Docker service names instead.

services:
  postgres:
    networks:
      - default
      - app_net

  rabbitmq:
    networks:
      - default
      - app_net

  valkey:
    networks:
      - default
      - app_net

  minio:
    networks:
      - default
      - app_net

  api:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_API_USER:-video-api}:${RABBITMQ_API_PASS:-video-api-secret}@rabbitmq:5672/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://valkey:6379/0"
      MINIO_ENDPOINT: "minio:9000"

  outbox:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_OUTBOX_USER:-video-outbox}:${RABBITMQ_OUTBOX_PASS:-video-outbox-secret}@rabbitmq:5672/${RABBITMQ_VHOST:-video}"

  worker-download:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DOWNLOAD_USER:-video-download}:${RABBITMQ_DOWNLOAD_PASS:-video-download-secret}@rabbitmq:5672/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://valkey:6379/0"
      MINIO_ENDPOINT: "minio:9000"

  worker-import:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_IMPORT_USER:-video-import}:${RABBITMQ_IMPORT_PASS:-video-import-secret}@rabbitmq:5672/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "minio:9000"

  worker-report:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_REPORT_USER:-video-report}:${RABBITMQ_REPORT_PASS:-video-report-secret}@rabbitmq:5672/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "minio:9000"

  provider-canary:
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}"
      MINIO_ENDPOINT: "minio:9000"

networks:
  app_net: {}
