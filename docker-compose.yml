name: video-server

x-app: &app
  image: video-server:local
  restart: unless-stopped
  stop_grace_period: 30s

x-api-env: &api-env
  APP_ENV: "${APP_ENV:-development}"
  SERVICE_ROLE: api
  APP_HOST: "${APP_HOST:-0.0.0.0}"
  APP_PORT: "${APP_PORT:-8101}"
  REQUEST_MAX_BYTES: "${REQUEST_MAX_BYTES:-262144}"
  REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-30}"
  APP_VERSION: "${APP_VERSION:-0.1.0}"
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://video:video@postgres:5432/video}"
  RABBITMQ_URL: "${RABBITMQ_URL:-amqp://video:video@rabbitmq:5672/}"
  VALKEY_URL: "${VALKEY_URL:-redis://valkey:6379/0}"
  RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE:-video.events}"
  DOWNLOAD_QUEUE: "${DOWNLOAD_QUEUE:-video.download}"
  ANALYSIS_QUEUE: "${ANALYSIS_QUEUE:-video.analysis}"
  ANALYSIS_ENABLED: "${ANALYSIS_ENABLED:-true}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
  MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-video-app-access}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-video-app-secret-change-me}"
  MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
  MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
  MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-false}"
  AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-development-jwt-secret-change-me-32-bytes}"
  AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:-video-server}"
  AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:-video-web}"
  AUTH_ACCESS_COOKIE_NAME: "${AUTH_ACCESS_COOKIE_NAME:-video_access_token}"
  AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:-video_refresh_token}"
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}"
  AUTH_REFRESH_TOKEN_TTL_SECONDS: "${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}"
  AUTH_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}"
  REQUEST_FINGERPRINT_SECRET: "${REQUEST_FINGERPRINT_SECRET:-development-fingerprint-secret-change-me}"
  URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtdXJsLWtleS0zMi1ieXRlcyEhISE=}"
  RUNNER_BASE_URL: "${RUNNER_BASE_URL:-http://media-runner:19100}"
  RUNNER_OPERATOR_BASE_URL: "${RUNNER_OPERATOR_BASE_URL:-}"
  RUNNER_WORKSPACE_ROOT: "${RUNNER_WORKSPACE_ROOT:-/work}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"

x-outbox-env: &outbox-env
  APP_ENV: "${APP_ENV:-development}"
  SERVICE_ROLE: outbox
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://video:video@postgres:5432/video}"
  RABBITMQ_URL: "${RABBITMQ_URL:-amqp://video:video@rabbitmq:5672/}"
  RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE:-video.events}"
  DOWNLOAD_QUEUE: "${DOWNLOAD_QUEUE:-video.download}"
  DOWNLOAD_ROUTING_KEY: "${DOWNLOAD_ROUTING_KEY:-download.requested}"
  ANALYSIS_QUEUE: "${ANALYSIS_QUEUE:-video.analysis}"
  ANALYSIS_REPORT_QUEUE: "${ANALYSIS_REPORT_QUEUE:-video.analysis-report}"
  JOB_LEASE_SECONDS: "${JOB_LEASE_SECONDS:-60}"
  OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-50}"
  OUTBOX_POLL_INTERVAL_SECONDS: "${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}"

x-download-env: &download-env
  APP_ENV: "${APP_ENV:-development}"
  SERVICE_ROLE: download-worker
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://video:video@postgres:5432/video}"
  RABBITMQ_URL: "${RABBITMQ_URL:-amqp://video:video@rabbitmq:5672/}"
  RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE:-video.events}"
  DOWNLOAD_QUEUE: "${DOWNLOAD_QUEUE:-video.download}"
  DOWNLOAD_ROUTING_KEY: "${DOWNLOAD_ROUTING_KEY:-download.requested}"
  DOWNLOAD_WORKER_THREADS: "${DOWNLOAD_WORKER_THREADS:-4}"
  ARTIFACT_GC_INTERVAL_SECONDS: "${ARTIFACT_GC_INTERVAL_SECONDS:-300}"
  ARTIFACT_GC_BATCH_SIZE: "${ARTIFACT_GC_BATCH_SIZE:-50}"
  ARTIFACT_DELETE_TIMEOUT_SECONDS: "${ARTIFACT_DELETE_TIMEOUT_SECONDS:-30}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-video-app-access}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-video-app-secret-change-me}"
  MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
  MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
  URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtdXJsLWtleS0zMi1ieXRlcyEhISE=}"
  RUNNER_BASE_URL: "${RUNNER_BASE_URL:-http://media-runner:19100}"
  RUNNER_OPERATOR_BASE_URL: "${RUNNER_OPERATOR_BASE_URL:-}"
  RUNNER_WORKSPACE_ROOT: "${RUNNER_WORKSPACE_ROOT:-/work}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"

x-report-env: &report-env
  APP_ENV: "${APP_ENV:-development}"
  SERVICE_ROLE: report-worker
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://video:video@postgres:5432/video}"
  RABBITMQ_URL: "${RABBITMQ_URL:-amqp://video:video@rabbitmq:5672/}"
  RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE:-video.events}"
  DOWNLOAD_QUEUE: "${DOWNLOAD_QUEUE:-video.download}"
  ANALYSIS_QUEUE: "${ANALYSIS_QUEUE:-video.analysis}"
  ANALYSIS_REPORT_QUEUE: "${ANALYSIS_REPORT_QUEUE:-video.analysis-report}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-video-app-access}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-video-app-secret-change-me}"
  MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
  MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"

x-runner-env: &runner-env
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
  RUNNER_EGRESS_PROXY: "${RUNNER_EGRESS_PROXY:-http://egress-proxy:3128}"
  RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
  RUNNER_WORKSPACE_ROOT: "${RUNNER_WORKSPACE_ROOT:-/work}"
  RUNNER_ACCESS_MODE: anonymous

x-postgres-env: &postgres-env
  POSTGRES_DB: "${POSTGRES_DB:-video}"
  POSTGRES_USER: "${POSTGRES_USER:-video}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-video}"

services:
  api:
    <<: *app
    environment: *api-env
    networks: [db_net, queue_net, quota_net, storage_net, runner_rpc_net, public_egress_net]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: video-server
    ports:
      - "127.0.0.1:8101:8101"
    command: ["python", "-m", "app.main"]
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  outbox:
    <<: *app
    environment: *outbox-env
    networks: [db_net, queue_net]
    container_name: outbox
    command: ["python", "-m", "app.workers.outbox.main"]
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker-download:
    <<: *app
    environment: *download-env
    networks: [db_net, queue_net, storage_net, runner_rpc_net]
    container_name: worker-download
    command: ["python", "-m", "app.workers.download.main"]
    volumes:
      - runner_work:/work
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy

  worker-report:
    <<: *app
    environment: *report-env
    networks: [db_net, queue_net, storage_net]
    container_name: worker-report
    command: ["python", "-m", "app.workers.report.main"]
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  media-runner:
    <<: *app
    environment: *runner-env
    networks: [runner_rpc_net, runner_egress_net]
    container_name: media-runner
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]
    volumes:
      - runner_work:/work
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  youtube-operator-runner:
    <<: *app
    profiles: [youtube-operator]
    environment:
      <<: *runner-env
      RUNNER_ACCESS_MODE: operator_managed
      RUNNER_MAX_ACTIVE_TASKS: "1"
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"youtube":"${YOUTUBE_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${YOUTUBE_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
      RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
      RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
      RUNNER_YOUTUBE_POT_BASE_URL: http://youtube-pot-provider:4416
      RUNNER_YOUTUBE_POT_PROVIDER_VERSION: bgutil-http-1.3.1
    networks: [runner_rpc_net, runner_egress_net, youtube_pot_net]
    container_name: youtube-operator-runner
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]
    volumes:
      - runner_work:/work
      - type: bind
        source: "${YOUTUBE_COOKIE_SECRET_DIR:-./.provider-secrets/youtube}"
        target: /run/provider-secrets/youtube
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
      youtube-pot-provider:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b
    profiles: [youtube-operator]
    container_name: youtube-pot-provider
    restart: unless-stopped
    networks: [youtube_pot_net, runner_egress_net]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(4416,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: egress-proxy
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    restart: unless-stopped
    stop_grace_period: 35s
    networks: [runner_egress_net, public_egress_net]
    volumes:
      - ./backend/config/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./backend/config/egress/blocked-destinations-docker-desktop.conf:/etc/squid/blocked-destinations.conf:ro
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  workspace-init:
    <<: *app
    container_name: workspace-init
    network_mode: none
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /work"]
    restart: "no"
    volumes:
      - runner_work:/work

  postgres:
    image: postgres:17.5-alpine
    environment: *postgres-env
    container_name: postgres
    networks: [db_net, public_egress_net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  database-init:
    image: postgres:17.5-alpine
    environment: *postgres-env
    container_name: database-init
    networks: [db_net]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql \
          --host=postgres \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --set=ON_ERROR_STOP=1 \
          --file=/schema/schema.sql
    restart: "no"
    volumes:
      - ./backend/sql/schema.sql:/schema/schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.0.9-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-video}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-video}"
    container_name: rabbitmq
    hostname: rabbitmq
    networks: [queue_net, public_egress_net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.1-alpine
    container_name: valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [quota_net]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-video-root}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}"
    container_name: minio
    networks: [storage_net, public_egress_net]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19190}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19191}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-video-root}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-video-app-access}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-video-app-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
    container_name: minio-init
    networks: [storage_net]
    entrypoint: ["/bin/sh", "/config/init.sh"]
    restart: "no"
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  runner_work:

networks:
  db_net:
    internal: true
  queue_net:
    internal: true
  quota_net:
    internal: true
  storage_net:
    internal: true
  runner_rpc_net:
    internal: true
  runner_egress_net:
    internal: true
  youtube_pot_net:
    internal: true
  public_egress_net:
