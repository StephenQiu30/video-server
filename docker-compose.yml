name: stephen-video

services:
  api:
    build:
      context: .
      target: api
    container_name: stephen-video-api
    env_file: .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - S3_ENDPOINT_URL=${DOCKER_S3_ENDPOINT_URL}
      - S3_PUBLIC_ENDPOINT_URL=${DOCKER_S3_PUBLIC_ENDPOINT_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: worker
    container_name: stephen-video-worker
    env_file: .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - REDIS_URL=${DOCKER_REDIS_URL}
      - S3_ENDPOINT_URL=${DOCKER_S3_ENDPOINT_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    container_name: stephen-video-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
