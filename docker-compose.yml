name: video-server-app

x-app-image: &app-image
  image: video-server:local
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

x-runtime-env: &runtime-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-video}:${RABBITMQ_PASSWORD:-video}@rabbitmq:5672/

x-storage-env: &storage-env
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:19190}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-video-app-access}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-video-app-secret-change-me}

services:
  api:
    <<: *app-image
    container_name: video-server-api
    command: ["python", "-m", "app.main"]
    restart: unless-stopped
    environment:
      <<: [*runtime-env, *storage-env]
      SERVICE_ROLE: api
      APP_PORT: "8101"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy
    networks:
      - video-server-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  outbox:
    <<: *app-image
    container_name: video-server-outbox
    command: ["python", "-m", "app.workers.outbox.main"]
    restart: unless-stopped
    environment:
      <<: *runtime-env
      SERVICE_ROLE: outbox
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - video-server-network

  worker-download:
    <<: *app-image
    container_name: video-server-worker-download
    command: ["python", "-m", "app.workers.download.main"]
    restart: unless-stopped
    environment:
      <<: [*runtime-env, *storage-env]
      SERVICE_ROLE: download-worker
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}
    volumes:
      - runner_work:/work
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy
    networks:
      - video-server-network

  worker-analysis:
    <<: *app-image
    container_name: video-server-worker-analysis
    command: ["python", "-m", "app.workers.analysis.main"]
    restart: unless-stopped
    environment:
      <<: [*runtime-env, *storage-env]
      SERVICE_ROLE: analysis-worker
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-ollama}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_ANALYSIS_MODEL: ${DEEPSEEK_ANALYSIS_MODEL:-deepseek-v4-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_ANALYSIS_MODEL: ${OLLAMA_ANALYSIS_MODEL:-deepseek-r1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-development-openai-key-not-for-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - analysis_work:/analysis-work
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - video-server-network

  media-runner:
    <<: *app-image
    container_name: video-server-media-runner
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]
    restart: unless-stopped
    environment:
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_MAX_ACTIVE_TASKS: "4"
    volumes:
      - runner_work:/work
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    networks:
      - video-server-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: video-server-egress-proxy
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    restart: unless-stopped
    volumes:
      - ./backend/config/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./backend/config/egress/blocked-destinations-docker-desktop.conf:/etc/squid/blocked-destinations.conf:ro
    networks:
      - video-server-network
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:17.5-alpine
    container_name: video-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video}
      POSTGRES_USER: ${POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -v ON_ERROR_STOP=1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1 FROM media_inspections LIMIT 1; SELECT 1 FROM download_jobs LIMIT 1; SELECT 1 FROM analysis_jobs LIMIT 1; SELECT 1 FROM outbox_events LIMIT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-network

  rabbitmq:
    image: rabbitmq:4.0.9-management
    container_name: video-server-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-video}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-network

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: video-server-minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
    ports:
      - "127.0.0.1:19190:9000"
      - "127.0.0.1:19191:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-network

  minio-init:
    image: minio/mc:latest
    container_name: video-server-minio-init
    entrypoint: ["/bin/sh", "/config/init.sh"]
    restart: "no"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-video-app-access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-video-app-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-video-artifacts}
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - video-server-network

  workspace-init:
    <<: *app-image
    container_name: video-server-workspace-init
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /work /analysis-work"]
    restart: "no"
    volumes:
      - runner_work:/work
      - analysis_work:/analysis-work
    networks:
      - video-server-network

networks:
  video-server-network:
    name: video-server-network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  runner_work:
  analysis_work:
