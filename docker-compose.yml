name: stephen-video

services:
  app:
    build:
      context: .
      target: app
    container_name: stephen-video-app
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL}
      - SKIP_DB_BOOTSTRAP=${SKIP_DB_BOOTSTRAP:-false}
    ports:
      - "${API_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)\"" ]
      interval: 10s
      timeout: 3s
      retries: 5
