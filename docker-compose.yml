name: ${COMPOSE_STACK_NAME:-video-server}

x-server-image: &server-image
  image: ${SERVER_IMAGE:-video-server:local}
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      NPM_VERSION: ${NPM_VERSION:-11.19.0}
      UV_VERSION: ${UV_VERSION:-0.11.32}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${COMPOSE_LOG_MAX_SIZE:-10m}
      max-file: ${COMPOSE_LOG_MAX_FILE:-3}

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql+asyncpg://${DOCKER_POSTGRES_USER:-video}:${DOCKER_POSTGRES_PASSWORD:-video}@postgres:5432/${DOCKER_POSTGRES_DB:-video}
  RABBITMQ_URL: amqp://${DOCKER_RABBITMQ_USER:-video}:${DOCKER_RABBITMQ_PASSWORD:-video}@rabbitmq:5672/

x-storage-environment: &storage-environment
  MINIO_ENDPOINT: minio:9000

x-public-storage-environment: &public-storage-environment
  MINIO_PUBLIC_ENDPOINT: ${COMPOSE_MINIO_PUBLIC_ENDPOINT:-localhost:19000}

x-runner-client-environment: &runner-client-environment
  RUNNER_BASE_URL: http://media-runner:19100

x-runner-environment: &runner-environment
  RUNNER_HMAC_SECRET: development-runner-secret-change-me
  RUNNER_EGRESS_PROXY: http://egress-proxy:3128
  RUNNER_WORKSPACE_ROOT: /work
  RUNNER_MAX_ACTIVE_TASKS: 4

x-code-security: &code-security
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=67108864
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  workspace-init:
    <<: *server-image
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-workspace-init
    user: "0:0"
    command:
      - sh
      - -c
      - install -d -o 10001 -g 10001 -m 0700 /work /analysis-work
    volumes:
      - runner_work:/work
      - analysis_work:/analysis-work
    network_mode: none
    restart: "no"

  api:
    <<: [*server-image, *service-defaults, *code-security]
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-api
    command: ["python", "-m", "app.main"]
    environment:
      <<:
        [
          *runtime-environment,
          *storage-environment,
          *public-storage-environment,
          *runner-client-environment,
        ]
      SERVICE_ROLE: api
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_API_PORT:-19090}:19090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy
    networks: [core, runner_control, app_ingress]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19090/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  outbox:
    <<: [*server-image, *service-defaults, *code-security]
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-outbox
    command: ["python", "-m", "app.workers.outbox.main"]
    environment:
      <<: *runtime-environment
      SERVICE_ROLE: outbox
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [core]

  worker-download:
    <<: [*server-image, *service-defaults, *code-security]
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-worker-download
    command: ["python", "-m", "app.workers.download.main"]
    environment:
      <<: [*runtime-environment, *storage-environment, *runner-client-environment]
      SERVICE_ROLE: download-worker
    volumes:
      - runner_work:/work
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      media-runner:
        condition: service_healthy
    networks: [core, runner_control]

  worker-analysis:
    <<: [*server-image, *service-defaults, *code-security]
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-worker-analysis
    command: ["python", "-m", "app.workers.analysis.main"]
    environment:
      <<: [*runtime-environment, *storage-environment]
      SERVICE_ROLE: analysis-worker
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-ollama}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_ANALYSIS_MODEL: ${DEEPSEEK_ANALYSIS_MODEL:-deepseek-v4-flash}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_ANALYSIS_MODEL: ${OLLAMA_ANALYSIS_MODEL:-deepseek-r1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-development-openai-key-not-for-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - analysis_work:/analysis-work
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [core, ai_egress]
    pids_limit: 128
    ulimits:
      fsize:
        soft: 2147483648
        hard: 2147483648
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 330s

  media-runner:
    <<: [*server-image, *service-defaults, *code-security]
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-media-runner
    command:
      - python
      - -m
      - uvicorn
      - app.runner.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "19100"
      - --no-access-log
    environment: *runner-environment
    expose:
      - "19100"
    volumes:
      - runner_work:/work
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    networks:
      runner_control:
        ipv4_address: ${COMPOSE_RUNNER_IP:-172.30.0.10}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    ulimits:
      fsize:
        soft: 2147483648
        hard: 2147483648
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 10s

  egress-proxy:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-egress-proxy
    image: ubuntu/squid:6.6-24.04_edge
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    user: "13:13"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=13,gid=13,mode=0700,size=16777216
    volumes:
      - ./backend/config/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./backend/config/egress/blocked-destinations-docker-desktop.conf:/etc/squid/blocked-destinations.conf:ro
    networks:
      runner_control:
        ipv4_address: ${COMPOSE_EGRESS_PROXY_IP:-172.30.0.20}
      public_egress: {}
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

  postgres:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-postgres
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-video}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-video}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -v ON_ERROR_STOP=1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          -c 'SELECT 1 FROM media_inspections LIMIT 1;
          SELECT 1 FROM download_jobs LIMIT 1;
          SELECT 1 FROM analysis_jobs LIMIT 1;
          SELECT 1 FROM outbox_events LIMIT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [core]
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-rabbitmq
    image: rabbitmq:4.0.9-management
    environment:
      RABBITMQ_DEFAULT_USER: ${DOCKER_RABBITMQ_USER:-video}
      RABBITMQ_DEFAULT_PASS: ${DOCKER_RABBITMQ_PASSWORD:-video}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [core]
    security_opt:
      - no-new-privileges:true

  minio:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DOCKER_MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${DOCKER_MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
    volumes:
      - minio_data:/data
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_MINIO_API_PORT:-19000}:9000"
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [core, app_ingress]
    security_opt:
      - no-new-privileges:true

  minio-init:
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-minio-init
    image: minio/mc:latest
    pull_policy: always
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${DOCKER_MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${DOCKER_MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
      MINIO_ACCESS_KEY: ${DOCKER_MINIO_ACCESS_KEY:-video-app-access}
      MINIO_SECRET_KEY: ${DOCKER_MINIO_SECRET_KEY:-video-app-secret-change-me}
      MINIO_BUCKET: ${DOCKER_MINIO_BUCKET:-video-artifacts}
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [core]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

networks:
  app_ingress: {}
  core:
    internal: true
  runner_control:
    internal: true
    ipam:
      config:
        - subnet: ${COMPOSE_RUNNER_SUBNET:-172.30.0.0/24}
  public_egress: {}
  ai_egress: {}

volumes:
  postgres_data: {}
  rabbitmq_data: {}
  minio_data: {}
  runner_work: {}
  analysis_work: {}
