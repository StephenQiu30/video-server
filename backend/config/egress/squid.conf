# Media Runner is fixed to 172.30.0.10 on the internal runner network.
acl media_runner src 172.30.0.10/32

acl safe_ports port 80
acl safe_ports port 443
acl ssl_ports port 443
acl connect method CONNECT

include /etc/squid/blocked-destinations.conf

acl blocked_name dstdomain localhost .local .localdomain .internal .home.arpa
acl ip_literal_url url_regex -i ^https?://[0-9]+(\.[0-9]+){3}([:/]|$)
acl ip_literal_url url_regex -i ^https?://\[
acl ip_literal_url url_regex -i ^[0-9]+(\.[0-9]+){3}:
acl ip_literal_url url_regex -i ^\[

http_access deny !media_runner
http_access deny !safe_ports
http_access deny connect !ssl_ports
http_access deny ip_literal_url
http_access deny blocked_name
http_access deny blocked_destination
http_access allow media_runner
http_access deny all

http_port 3128
cache deny all
access_log none
cache_log stdio:/dev/stderr
cache_store_log none
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all
pid_filename /tmp/squid.pid
coredump_dir /tmp
