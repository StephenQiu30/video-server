name: video-server-env

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: video-server-dev-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.0.9-management
    container_name: video-server-dev-rabbitmq
    hostname: video-server-dev-rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: video-server-dev-minio
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:19190:9000"
      - "127.0.0.1:19191:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: video-server-dev-minio-init
    entrypoint: ["/bin/sh", "/config/init.sh"]
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
