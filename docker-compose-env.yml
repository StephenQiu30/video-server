name: ${COMPOSE_ENV_STACK_NAME:-video-server-env}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${COMPOSE_LOG_MAX_SIZE:-10m}
      max-file: ${COMPOSE_LOG_MAX_FILE:-3}

services:
  postgres:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-dev-postgres
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-video}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-video}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -v ON_ERROR_STOP=1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          -c 'SELECT 1 FROM media_inspections LIMIT 1;
          SELECT 1 FROM download_jobs LIMIT 1;
          SELECT 1 FROM analysis_jobs LIMIT 1;
          SELECT 1 FROM outbox_events LIMIT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-dev-rabbitmq
    image: rabbitmq:4.0.9-management
    environment:
      RABBITMQ_DEFAULT_USER: ${DOCKER_RABBITMQ_USER:-video}
      RABBITMQ_DEFAULT_PASS: ${DOCKER_RABBITMQ_PASSWORD:-video}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_RABBITMQ_PORT:-5673}:5672"
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    <<: *service-defaults
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-dev-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DOCKER_MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${DOCKER_MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_MINIO_API_PORT:-19000}:9000"
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${COMPOSE_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    container_name: ${COMPOSE_CONTAINER_PREFIX:-video-server}-dev-minio-init
    image: minio/mc:latest
    pull_policy: always
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${DOCKER_MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${DOCKER_MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
      MINIO_ACCESS_KEY: ${DOCKER_MINIO_ACCESS_KEY:-video-app-access}
      MINIO_SECRET_KEY: ${DOCKER_MINIO_SECRET_KEY:-video-app-secret-change-me}
      MINIO_BUCKET: ${DOCKER_MINIO_BUCKET:-video-artifacts}
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  postgres_data: {}
  rabbitmq_data: {}
  minio_data: {}
