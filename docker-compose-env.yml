name: video-server-env

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: video-server-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video}
      POSTGRES_USER: ${POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -v ON_ERROR_STOP=1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1 FROM media_inspections LIMIT 1; SELECT 1 FROM download_jobs LIMIT 1; SELECT 1 FROM analysis_jobs LIMIT 1; SELECT 1 FROM outbox_events LIMIT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-env-network

  rabbitmq:
    image: rabbitmq:4.0.9-management
    container_name: video-server-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-video}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-env-network

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: video-server-dev-minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
    ports:
      - "127.0.0.1:19190:9000"
      - "127.0.0.1:19191:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - video-server-env-network

  minio-init:
    image: minio/mc:latest
    container_name: video-server-dev-minio-init
    entrypoint: ["/bin/sh", "/config/init.sh"]
    restart: "no"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-video-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-video-root-secret-change-me}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-video-app-access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-video-app-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-video-artifacts}
    volumes:
      - ./backend/config/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - video-server-env-network

networks:
  video-server-env-network:
    name: video-server-env-network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
