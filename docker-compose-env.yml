services:
  api:
    env_file:
      - .env
    ports:
      - "127.0.0.1:8101:8101"

  outbox:
    env_file:
      - .env

  worker-download:
    env_file:
      - .env

  worker-analysis:
    env_file:
      - .env

  media-runner:
    env_file:
      - .env

  postgres:
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT in .env}:5432"

  rabbitmq:
    env_file:
      - .env
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:?set RABBITMQ_HOST_PORT in .env}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:?set RABBITMQ_MANAGEMENT_HOST_PORT in .env}:15672"

  minio:
    env_file:
      - .env
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:?set MINIO_HOST_PORT in .env}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:?set MINIO_CONSOLE_HOST_PORT in .env}:9001"

  minio-init:
    env_file:
      - .env
