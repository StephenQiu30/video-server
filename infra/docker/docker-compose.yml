name: ${COMPOSE_PROJECT_NAME:-video-downloader}

services:
  web:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-web
    build:
      context: ../..
      dockerfile: infra/docker/web.prod.Dockerfile
      args:
        UMI_APP_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_HTTP_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-api
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      target: api
    env_file:
      - ${APP_ENV_FILE:-../../.env.production}
    ports:
      - "${API_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-worker
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      target: worker
    env_file:
      - ${APP_ENV_FILE:-../../.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-redis
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader}-minio
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
