name: ${COMPOSE_PROJECT_NAME:-stephen-video}

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      target: api
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    ports:
      - "${API_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles:
      - worker
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      target: worker
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    restart: unless-stopped
