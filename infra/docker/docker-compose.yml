name: ${COMPOSE_PROJECT_NAME:-video-downloader-local}

services:
  web:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader-local}-web
    build:
      context: ../..
      dockerfile: infra/docker/web.prod.Dockerfile
      args:
        UMI_APP_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_HTTP_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    container_name: ${CONTAINER_NAME_PREFIX:-video-downloader-local}-api
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
      target: api
    env_file:
      - ${APP_ENV_FILE:-../../.env}
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL is required}}
      REDIS_URL: ${DOCKER_REDIS_URL:-${REDIS_URL:?REDIS_URL is required}}
      S3_ENDPOINT_URL: ${DOCKER_S3_ENDPOINT_URL:-${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}}
      S3_PUBLIC_ENDPOINT_URL: ${DOCKER_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10
