x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    SITE_URL: "${SITE_URL:?SITE_URL is required}"

x-provider-session-runner: &provider-session-runner
  build: *app-build
  image: video-server:prod
  restart: unless-stopped
  networks:
    - runner_rpc_net
    - runner_egress_net
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
  depends_on:
    egress-proxy:
      condition: service_healthy
  command:
    [
      "python",
      "-m",
      "uvicorn",
      "app.runner.main:create_app",
      "--factory",
      "--host",
      "0.0.0.0",
      "--port",
      "19100",
      "--no-access-log",
    ]

x-provider-session-environment: &provider-session-environment
  APP_ENV: "${APP_ENV:-production}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
  RUNNER_EGRESS_PROXY: http://egress-proxy:3128
  RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
  RUNNER_WORKSPACE_ROOT: /work
  RUNNER_ACCESS_MODE: operator_managed
  RUNNER_MAX_ACTIVE_TASKS: "1"
  RUNNER_DOWNLOAD_TIMEOUT_SECONDS: "${RUNNER_DOWNLOAD_TIMEOUT_SECONDS:-7200}"
  RUNNER_INSPECT_TIMEOUT_SECONDS: "${RUNNER_INSPECT_TIMEOUT_SECONDS:-120}"
  RUNNER_MAX_DURATION_SECONDS: "${RUNNER_MAX_DURATION_SECONDS:-86400}"
  RUNNER_MAX_OUTPUT_BYTES: "${RUNNER_MAX_OUTPUT_BYTES:-21474836480}"
  RUNNER_MAX_WORKSPACE_BYTES: "${RUNNER_MAX_WORKSPACE_BYTES:-42949672960}"
  RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "true"
  RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
  RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
  RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS: "${RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS:-0}"
  PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"

services:
  api:
    build: *app-build
    image: video-server:prod
    container_name: video-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: api
      APP_HOST: 0.0.0.0
      APP_PORT: 8111
      TRUSTED_PROXY_CIDRS: '["127.0.0.0/8","::1/128","10.251.0.10/32"]'
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_API_USER:-video-api}:${RABBITMQ_API_PASS:-video-api-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://${VALKEY_HOST:-host.docker.internal}:${VALKEY_PORT:-6379}/0"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
      MINIO_LOCAL_BROWSER_ENDPOINT: "${MINIO_LOCAL_BROWSER_ENDPOINT:-}"
      MINIO_LOCAL_BROWSER_SECURE: "${MINIO_LOCAL_BROWSER_SECURE:-false}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      ARTICLE_DISCOVERY_PROXY_URL: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
      - runner_egress_net
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8111}:8111"
    depends_on:
      media-runner:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: ["python", "-m", "app.main"]

  frontend:
    build: *app-build
    image: video-server:prod
    container_name: video-frontend
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: http://api:8111
      HOSTNAME: 0.0.0.0
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-false}"
      MINIO_LOCAL_BROWSER_ENDPOINT: "${MINIO_LOCAL_BROWSER_ENDPOINT:-}"
      MINIO_LOCAL_BROWSER_SECURE: "${MINIO_LOCAL_BROWSER_SECURE:-false}"
      NODE_ENV: production
      PORT: 8101
      SITE_URL: "${SITE_URL:?SITE_URL is required}"
    networks:
      app_net:
        ipv4_address: 10.251.0.10
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8101}:8101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    working_dir: /app/frontend/.next/standalone
    command: ["node", "server.js"]

  outbox:
    build: *app-build
    image: video-server:prod
    container_name: video-outbox
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: outbox
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_OUTBOX_USER:-video-outbox}:${RABBITMQ_OUTBOX_PASS:-video-outbox-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.outbox.main"]

  worker-download:
    build: *app-build
    image: video-server:prod
    container_name: video-worker-download
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: download-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DOWNLOAD_USER:-video-download}:${RABBITMQ_DOWNLOAD_PASS:-video-download-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://${VALKEY_HOST:-host.docker.internal}:${VALKEY_PORT:-6379}/0"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    volumes:
      - runner_work:/work
    depends_on:
      media-runner:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    command: ["python", "-m", "app.workers.download.main"]

  worker-import:
    build: *app-build
    image: video-server:prod
    container_name: video-worker-import
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: import-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_IMPORT_USER:-video-import}:${RABBITMQ_IMPORT_PASS:-video-import-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.imports.main"]

  worker-report:
    build: *app-build
    image: video-server:prod
    container_name: video-worker-report
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: report-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_REPORT_USER:-video-report}:${RABBITMQ_REPORT_PASS:-video-report-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.report.main"]

  provider-canary:
    build: *app-build
    image: video-server:prod
    container_name: video-provider-canary
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: provider-canary
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    volumes:
      - runner_work:/work
    depends_on:
      media-runner:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    command: ["python", "-m", "app.workers.canary.main"]

  media-runner:
    build: *app-build
    image: video-server:prod
    container_name: media-runner
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: anonymous
      RUNNER_MAX_ACTIVE_TASKS: "${RUNNER_MAX_ACTIVE_TASKS:-4}"
      RUNNER_DOWNLOAD_TIMEOUT_SECONDS: "${RUNNER_DOWNLOAD_TIMEOUT_SECONDS:-7200}"
      RUNNER_INSPECT_TIMEOUT_SECONDS: "${RUNNER_INSPECT_TIMEOUT_SECONDS:-120}"
      RUNNER_MAX_DURATION_SECONDS: "${RUNNER_MAX_DURATION_SECONDS:-86400}"
      RUNNER_MAX_OUTPUT_BYTES: "${RUNNER_MAX_OUTPUT_BYTES:-21474836480}"
      RUNNER_MAX_WORKSPACE_BYTES: "${RUNNER_MAX_WORKSPACE_BYTES:-42949672960}"
      RUNNER_YOUTUBE_POT_BASE_URL: http://youtube-pot-provider:4416
      RUNNER_YOUTUBE_POT_PROVIDER_VERSION: bgutil-http-1.3.2
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
      - youtube_pot_net
    volumes:
      - runner_work:/work
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: egress-proxy
    restart: unless-stopped
    stop_grace_period: 35s
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    ports:
      - "127.0.0.1:${EGRESS_PROXY_HOST_PORT:-13128}:3128"
    volumes:
      - ./backend/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./backend/egress/blocked-destinations.conf:/etc/squid/blocked-destinations.conf:ro
    networks:
      - runner_egress_net
      - youtube_pot_net
      - proxy_uplink_net
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  workspace-init:
    build: *app-build
    image: video-server:prod
    container_name: workspace-init
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /work"]
    volumes:
      - runner_work:/work

  provider-operator-runner:
    build: *app-build
    image: video-server:prod
    container_name: provider-operator-runner
    restart: unless-stopped
    profiles: [provider-operator]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: operator_managed
      RUNNER_MAX_ACTIVE_TASKS: "1"
      RUNNER_DOWNLOAD_TIMEOUT_SECONDS: "${RUNNER_DOWNLOAD_TIMEOUT_SECONDS:-7200}"
      RUNNER_INSPECT_TIMEOUT_SECONDS: "${RUNNER_INSPECT_TIMEOUT_SECONDS:-120}"
      RUNNER_MAX_DURATION_SECONDS: "${RUNNER_MAX_DURATION_SECONDS:-86400}"
      RUNNER_MAX_OUTPUT_BYTES: "${RUNNER_MAX_OUTPUT_BYTES:-21474836480}"
      RUNNER_MAX_WORKSPACE_BYTES: "${RUNNER_MAX_WORKSPACE_BYTES:-42949672960}"
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"${OPERATOR_PROVIDER_KEY:-disabled}":"${OPERATOR_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${OPERATOR_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
      RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
      RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
      RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS: "${RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS:-0}"
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
    volumes:
      - runner_work:/work
      - type: bind
        source: "${OPERATOR_COOKIE_SECRET_DIR:-./.provider-secrets/provider}"
        target: "/run/provider-secrets/${OPERATOR_PROVIDER_KEY:-disabled}"
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      egress-proxy:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  douyin-operator-runner:
    <<: *provider-session-runner
    container_name: douyin-operator-runner
    profiles: [douyin-operator]
    environment:
      <<: *provider-session-environment
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"douyin":"${DOUYIN_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${DOUYIN_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${DOUYIN_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
    volumes:
      - runner_work:/work
      - type: bind
        source: "${DOUYIN_COOKIE_SECRET_DIR:-./.provider-secrets/douyin}"
        target: /run/provider-secrets/douyin
        read_only: true
        bind:
          create_host_path: false

  xiaohongshu-operator-runner:
    <<: *provider-session-runner
    container_name: xiaohongshu-operator-runner
    profiles: [xiaohongshu-operator]
    environment:
      <<: *provider-session-environment
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"xiaohongshu":"${XIAOHONGSHU_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${XIAOHONGSHU_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${XIAOHONGSHU_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
    volumes:
      - runner_work:/work
      - type: bind
        source: "${XIAOHONGSHU_COOKIE_SECRET_DIR:-./.provider-secrets/xiaohongshu}"
        target: /run/provider-secrets/xiaohongshu
        read_only: true
        bind:
          create_host_path: false

  reddit-operator-runner:
    <<: *provider-session-runner
    container_name: reddit-operator-runner
    profiles: [reddit-operator]
    environment:
      <<: *provider-session-environment
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"reddit":"${REDDIT_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${REDDIT_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${REDDIT_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
    volumes:
      - runner_work:/work
      - type: bind
        source: "${REDDIT_COOKIE_SECRET_DIR:-./.provider-secrets/reddit}"
        target: /run/provider-secrets/reddit
        read_only: true
        bind:
          create_host_path: false

  x-operator-runner:
    <<: *provider-session-runner
    container_name: x-operator-runner
    profiles: [x-operator]
    environment:
      <<: *provider-session-environment
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"x":"${X_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${X_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${X_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
    volumes:
      - runner_work:/work
      - type: bind
        source: "${X_COOKIE_SECRET_DIR:-/run/secrets/video-server/x}"
        target: /run/provider-secrets/x
        read_only: true
        bind:
          create_host_path: false

  instagram-operator-runner:
    <<: *provider-session-runner
    container_name: instagram-operator-runner
    profiles: [instagram-operator]
    environment:
      <<: *provider-session-environment
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"instagram":"${INSTAGRAM_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${INSTAGRAM_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${INSTAGRAM_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
    volumes:
      - runner_work:/work
      - type: bind
        source: "${INSTAGRAM_COOKIE_SECRET_DIR:-/run/secrets/video-server/instagram}"
        target: /run/provider-secrets/instagram
        read_only: true
        bind:
          create_host_path: false

  youtube-operator-runner:
    build: *app-build
    image: video-server:prod
    container_name: youtube-operator-runner
    restart: unless-stopped
    profiles: [youtube-operator]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: operator_managed
      RUNNER_MAX_ACTIVE_TASKS: "1"
      RUNNER_DOWNLOAD_TIMEOUT_SECONDS: "${RUNNER_DOWNLOAD_TIMEOUT_SECONDS:-7200}"
      RUNNER_INSPECT_TIMEOUT_SECONDS: "${RUNNER_INSPECT_TIMEOUT_SECONDS:-120}"
      RUNNER_MAX_DURATION_SECONDS: "${RUNNER_MAX_DURATION_SECONDS:-86400}"
      RUNNER_MAX_OUTPUT_BYTES: "${RUNNER_MAX_OUTPUT_BYTES:-21474836480}"
      RUNNER_MAX_WORKSPACE_BYTES: "${RUNNER_MAX_WORKSPACE_BYTES:-42949672960}"
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"youtube":"${YOUTUBE_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${YOUTUBE_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
      RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
      RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
      RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS: "${RUNNER_PROVIDER_SESSION_MAX_AGE_SECONDS:-0}"
      RUNNER_YOUTUBE_COOKIE_SYNC_ROOT: /run/youtube-cookie-sync
      RUNNER_YOUTUBE_POT_BASE_URL: http://youtube-pot-provider:4416
      RUNNER_YOUTUBE_POT_PROVIDER_VERSION: bgutil-http-1.3.2
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
      - youtube_pot_net
    volumes:
      - runner_work:/work
      - type: bind
        source: "${YOUTUBE_COOKIE_SECRET_DIR:-./.provider-secrets/youtube}"
        target: /run/provider-secrets/youtube
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${YOUTUBE_COOKIE_SYNC_DIR:-${HOME}/Library/Caches/FrameFetch/youtube-cookie-sync}"
        target: /run/youtube-cookie-sync
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      egress-proxy:
        condition: service_healthy
      youtube-pot-provider:
        condition: service_started
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2@sha256:9a96e6385ce1928da87dea07b1cab0413d2cf8c07a3b8a8bd419f53df2c3843c
    container_name: youtube-pot-provider
    restart: unless-stopped
    read_only: true
    entrypoint:
      ["/usr/local/bin/node", "/opt/video/youtube-pot-supervisor.mjs"]
    environment:
      YOUTUBE_POT_EXPECTED_VERSION: "1.3.2"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
    networks:
      - youtube_pot_net
    volumes:
      - type: bind
        source: ./backend/ops/youtube-pot-supervisor.mjs
        target: /opt/video/youtube-pot-supervisor.mjs
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  runner_work:

networks:
  app_net:
    ipam:
      config:
        - subnet: 10.251.0.0/24
          ip_range: 10.251.0.128/25
  runner_rpc_net:
    internal: true
  runner_egress_net:
    internal: true
  youtube_pot_net:
    internal: true
  proxy_uplink_net:
