services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: api
      APP_HOST: 0.0.0.0
      APP_PORT: 8101
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_API_USER:-video-api}:${RABBITMQ_API_PASS:-video-api-secret}@host.docker.internal:${HOST_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://host.docker.internal:${HOST_VALKEY_PORT:-6379}/0"
      MINIO_ENDPOINT: "host.docker.internal:${HOST_MINIO_PORT:-19190}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
      MINIO_ACCESS_KEY: "${MINIO_API_ACCESS_KEY:-video-api-access}"
      MINIO_SECRET_KEY: "${MINIO_API_SECRET_KEY:-video-api-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8101}:8101"
    depends_on:
      media-runner:
        condition: service_started
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: ["python", "-m", "app.main"]

  outbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-outbox
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: outbox
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_OUTBOX_USER:-video-outbox}:${RABBITMQ_OUTBOX_PASS:-video-outbox-secret}@host.docker.internal:${HOST_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.outbox.main"]

  worker-download:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-worker-download
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: download-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DOWNLOAD_USER:-video-download}:${RABBITMQ_DOWNLOAD_PASS:-video-download-secret}@host.docker.internal:${HOST_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      VALKEY_URL: "redis://host.docker.internal:${HOST_VALKEY_PORT:-6379}/0"
      MINIO_ENDPOINT: "host.docker.internal:${HOST_MINIO_PORT:-19190}"
      MINIO_ACCESS_KEY: "${MINIO_DOWNLOAD_ACCESS_KEY:-video-download-access}"
      MINIO_SECRET_KEY: "${MINIO_DOWNLOAD_SECRET_KEY:-video-download-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    depends_on:
      media-runner:
        condition: service_started
      egress-proxy:
        condition: service_healthy
    command: ["python", "-m", "app.workers.download.main"]

  worker-import:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-worker-import
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: import-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_IMPORT_USER:-video-import}:${RABBITMQ_IMPORT_PASS:-video-import-secret}@host.docker.internal:${HOST_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "host.docker.internal:${HOST_MINIO_PORT:-19190}"
      MINIO_ACCESS_KEY: "${MINIO_IMPORT_ACCESS_KEY:-video-import-access}"
      MINIO_SECRET_KEY: "${MINIO_IMPORT_SECRET_KEY:-video-import-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.imports.main"]

  worker-report:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-worker-report
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: report-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_REPORT_USER:-video-report}:${RABBITMQ_REPORT_PASS:-video-report-secret}@host.docker.internal:${HOST_RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "host.docker.internal:${HOST_MINIO_PORT:-19190}"
      MINIO_ACCESS_KEY: "${MINIO_REPORT_ACCESS_KEY:-video-report-access}"
      MINIO_SECRET_KEY: "${MINIO_REPORT_SECRET_KEY:-video-report-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.report.main"]

  provider-canary:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: video-provider-canary
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVICE_ROLE: provider-canary
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@host.docker.internal:${HOST_POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      MINIO_ENDPOINT: "host.docker.internal:${HOST_MINIO_PORT:-19190}"
      MINIO_ACCESS_KEY: "${MINIO_CANARY_ACCESS_KEY:-video-canary-access}"
      MINIO_SECRET_KEY: "${MINIO_CANARY_SECRET_KEY:-video-canary-secret-change-me}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "false"
      RUNNER_BASE_URL: http://media-runner:19100
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    depends_on:
      media-runner:
        condition: service_started
      egress-proxy:
        condition: service_healthy
    command: ["python", "-m", "app.workers.canary.main"]

  media-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: media-runner
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: anonymous
      RUNNER_MAX_ACTIVE_TASKS: "${RUNNER_MAX_ACTIVE_TASKS:-4}"
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
    volumes:
      - runner_work:/work
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: egress-proxy
    restart: unless-stopped
    stop_grace_period: 35s
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    ports:
      - "127.0.0.1:${EGRESS_PROXY_HOST_PORT:-13128}:3128"
    volumes:
      - ./backend/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./backend/egress/blocked-destinations.conf:/etc/squid/blocked-destinations.conf:ro
    networks:
      - runner_egress_net
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  workspace-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: workspace-init
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /work"]
    volumes:
      - runner_work:/work

  provider-operator-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: provider-operator-runner
    restart: unless-stopped
    profiles: [provider-operator]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: operator_managed
      RUNNER_MAX_ACTIVE_TASKS: "1"
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"${OPERATOR_PROVIDER_KEY:-disabled}":"${OPERATOR_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${OPERATOR_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
      RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
      RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
    volumes:
      - runner_work:/work
      - type: bind
        source: "${OPERATOR_COOKIE_SECRET_DIR:-./.provider-secrets/provider}"
        target: "/run/provider-secrets/${OPERATOR_PROVIDER_KEY:-disabled}"
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      egress-proxy:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  youtube-operator-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server:prod
    container_name: youtube-operator-runner
    restart: unless-stopped
    profiles: [youtube-operator]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_ACCESS_MODE: operator_managed
      RUNNER_MAX_ACTIVE_TASKS: "1"
      RUNNER_OPERATOR_SESSION_VERSIONS: '{"youtube":"${YOUTUBE_COOKIE_VERSION:-disabled}"}'
      RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS: "${RUNNER_OPERATOR_RETAINED_SESSION_VERSIONS:-{}}"
      RUNNER_OPERATOR_ACCOUNT_BASELINE_ATTESTED: "${YOUTUBE_OPERATOR_ACCOUNT_BASELINE_ATTESTED:-false}"
      RUNNER_PROVIDER_SECRET_ROOT: /run/provider-secrets
      RUNNER_PROVIDER_SECRET_TEMP_ROOT: /run/provider-secrets-tmp
      RUNNER_YOUTUBE_POT_BASE_URL: http://youtube-pot-provider:4416
      RUNNER_YOUTUBE_POT_PROVIDER_VERSION: bgutil-http-1.3.1
      PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"
    networks:
      - runner_rpc_net
      - runner_egress_net
    volumes:
      - runner_work:/work
      - type: bind
        source: "${YOUTUBE_COOKIE_SECRET_DIR:-./.provider-secrets/youtube}"
        target: /run/provider-secrets/youtube
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/provider-secrets-tmp:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    depends_on:
      egress-proxy:
        condition: service_healthy
      youtube-pot-provider:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.runner.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "19100",
        "--no-access-log",
      ]

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646
    container_name: youtube-pot-provider
    restart: unless-stopped
    profiles: [youtube-operator]
    networks:
      - youtube_pot_net
      - runner_egress_net
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(4416,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  runner_work:

networks:
  app_net:
  runner_rpc_net:
    internal: true
  runner_egress_net:
  youtube_pot_net:
    internal: true
