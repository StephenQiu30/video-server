name: video-server

services:
  api:
    image: video-server:prod
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
      RABBITMQ_URL: "${RABBITMQ_API_URL:?set RABBITMQ_API_URL in .env.prod}"
      VALKEY_URL: "${VALKEY_URL:?set VALKEY_URL in .env.prod}"
      METRICS_ACCESS_KEY: "${METRICS_ACCESS_KEY:?set METRICS_ACCESS_KEY in .env.prod}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
      MINIO_ACCESS_KEY: "${MINIO_API_ACCESS_KEY:?set MINIO_API_ACCESS_KEY in .env.prod}"
      MINIO_SECRET_KEY: "${MINIO_API_SECRET_KEY:?set MINIO_API_SECRET_KEY in .env.prod}"
      MINIO_IMPORT_ACCESS_KEY: "${MINIO_IMPORT_ACCESS_KEY:?set MINIO_IMPORT_ACCESS_KEY in .env.prod}"
      MINIO_IMPORT_SECRET_KEY: "${MINIO_IMPORT_SECRET_KEY:?set MINIO_IMPORT_SECRET_KEY in .env.prod}"
      ARTIFACT_DOWNLOAD_URL_TTL_SECONDS: "${ARTIFACT_DOWNLOAD_URL_TTL_SECONDS:?set ARTIFACT_DOWNLOAD_URL_TTL_SECONDS in .env.prod}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env.prod}"
      AUTH_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:?set AUTH_BOOTSTRAP_ADMIN_EMAIL in .env.prod}"
      REQUEST_FINGERPRINT_SECRET: "${REQUEST_FINGERPRINT_SECRET:?set REQUEST_FINGERPRINT_SECRET in .env.prod}"
      URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:?set URL_ENCRYPTION_KEY in .env.prod}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
    ports: !override
      - "8101:8101"

  outbox:
    image: video-server:prod
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
      RABBITMQ_URL: "${RABBITMQ_OUTBOX_URL:?set RABBITMQ_OUTBOX_URL in .env.prod}"

  worker-download:
    image: video-server:prod
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
      RABBITMQ_URL: "${RABBITMQ_DOWNLOAD_URL:?set RABBITMQ_DOWNLOAD_URL in .env.prod}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
      MINIO_ACCESS_KEY: "${MINIO_DOWNLOAD_ACCESS_KEY:?set MINIO_DOWNLOAD_ACCESS_KEY in .env.prod}"
      MINIO_SECRET_KEY: "${MINIO_DOWNLOAD_SECRET_KEY:?set MINIO_DOWNLOAD_SECRET_KEY in .env.prod}"
      URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:?set URL_ENCRYPTION_KEY in .env.prod}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
      ARTIFACT_TTL_SECONDS: "${ARTIFACT_TTL_SECONDS:?set ARTIFACT_TTL_SECONDS in .env.prod}"
      ARTIFACT_GC_INTERVAL_SECONDS: "${ARTIFACT_GC_INTERVAL_SECONDS:?set ARTIFACT_GC_INTERVAL_SECONDS in .env.prod}"
      ARTIFACT_GC_BATCH_SIZE: "${ARTIFACT_GC_BATCH_SIZE:?set ARTIFACT_GC_BATCH_SIZE in .env.prod}"
      ARTIFACT_DELETE_TIMEOUT_SECONDS: "${ARTIFACT_DELETE_TIMEOUT_SECONDS:?set ARTIFACT_DELETE_TIMEOUT_SECONDS in .env.prod}"

  provider-canary:
    image: video-server:prod
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
      MINIO_ACCESS_KEY: "${MINIO_CANARY_ACCESS_KEY:?set MINIO_CANARY_ACCESS_KEY in .env.prod}"
      MINIO_SECRET_KEY: "${MINIO_CANARY_SECRET_KEY:?set MINIO_CANARY_SECRET_KEY in .env.prod}"
      URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:?set URL_ENCRYPTION_KEY in .env.prod}"
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"

  worker-report:
    image: video-server:prod
    environment:
      APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
      RABBITMQ_URL: "${RABBITMQ_REPORT_URL:?set RABBITMQ_REPORT_URL in .env.prod}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
      MINIO_ACCESS_KEY: "${MINIO_REPORT_ACCESS_KEY:?set MINIO_REPORT_ACCESS_KEY in .env.prod}"
      MINIO_SECRET_KEY: "${MINIO_REPORT_SECRET_KEY:?set MINIO_REPORT_SECRET_KEY in .env.prod}"
      ANALYSIS_REPORT_TTL_SECONDS: "${ANALYSIS_REPORT_TTL_SECONDS:?set ANALYSIS_REPORT_TTL_SECONDS in .env.prod}"
      ANALYSIS_REPORT_GC_INTERVAL_SECONDS: "${ANALYSIS_REPORT_GC_INTERVAL_SECONDS:?set ANALYSIS_REPORT_GC_INTERVAL_SECONDS in .env.prod}"
      ANALYSIS_REPORT_GC_BATCH_SIZE: "${ANALYSIS_REPORT_GC_BATCH_SIZE:?set ANALYSIS_REPORT_GC_BATCH_SIZE in .env.prod}"
      ANALYSIS_REPORT_ORPHAN_GRACE_SECONDS: "${ANALYSIS_REPORT_ORPHAN_GRACE_SECONDS:?set ANALYSIS_REPORT_ORPHAN_GRACE_SECONDS in .env.prod}"
      ARTIFACT_DELETE_TIMEOUT_SECONDS: "${ARTIFACT_DELETE_TIMEOUT_SECONDS:?set ARTIFACT_DELETE_TIMEOUT_SECONDS in .env.prod}"

  media-runner:
    image: video-server:prod
    environment:
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
      RUNNER_EGRESS_PROXY: "${RUNNER_EGRESS_PROXY:?set RUNNER_EGRESS_PROXY in .env.prod}"

  youtube-operator-runner:
    image: video-server:prod
    environment:
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
      RUNNER_EGRESS_PROXY: "${RUNNER_EGRESS_PROXY:?set RUNNER_EGRESS_PROXY in .env.prod}"

  provider-operator-runner:
    image: video-server:prod
    environment:
      RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
      RUNNER_EGRESS_PROXY: "${RUNNER_EGRESS_PROXY:?set RUNNER_EGRESS_PROXY in .env.prod}"

  youtube-pot-provider:

  egress-proxy:
    ports: !reset []

  workspace-init:
    image: video-server:prod

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env.prod}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env.prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"

  database-init:
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env.prod}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env.prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"

  rabbitmq:
    ports: !override
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER in .env.prod}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_ADMIN_PASS:?set RABBITMQ_ADMIN_PASS in .env.prod}"

  rabbitmq-init:
    environment:
      RABBITMQ_ADMIN_USER: "${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER in .env.prod}"
      RABBITMQ_ADMIN_PASS: "${RABBITMQ_ADMIN_PASS:?set RABBITMQ_ADMIN_PASS in .env.prod}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:?set RABBITMQ_VHOST in .env.prod}"
      RABBITMQ_API_USER: "${RABBITMQ_API_USER:?set RABBITMQ_API_USER in .env.prod}"
      RABBITMQ_API_PASS: "${RABBITMQ_API_PASS:?set RABBITMQ_API_PASS in .env.prod}"
      RABBITMQ_OUTBOX_USER: "${RABBITMQ_OUTBOX_USER:?set RABBITMQ_OUTBOX_USER in .env.prod}"
      RABBITMQ_OUTBOX_PASS: "${RABBITMQ_OUTBOX_PASS:?set RABBITMQ_OUTBOX_PASS in .env.prod}"
      RABBITMQ_DOWNLOAD_USER: "${RABBITMQ_DOWNLOAD_USER:?set RABBITMQ_DOWNLOAD_USER in .env.prod}"
      RABBITMQ_DOWNLOAD_PASS: "${RABBITMQ_DOWNLOAD_PASS:?set RABBITMQ_DOWNLOAD_PASS in .env.prod}"
      RABBITMQ_ANALYSIS_USER: "${RABBITMQ_ANALYSIS_USER:?set RABBITMQ_ANALYSIS_USER in .env.prod}"
      RABBITMQ_ANALYSIS_PASS: "${RABBITMQ_ANALYSIS_PASS:?set RABBITMQ_ANALYSIS_PASS in .env.prod}"
      RABBITMQ_REPORT_USER: "${RABBITMQ_REPORT_USER:?set RABBITMQ_REPORT_USER in .env.prod}"
      RABBITMQ_REPORT_PASS: "${RABBITMQ_REPORT_PASS:?set RABBITMQ_REPORT_PASS in .env.prod}"
      RABBITMQ_DLQ_USER: "${RABBITMQ_DLQ_USER:?set RABBITMQ_DLQ_USER in .env.prod}"
      RABBITMQ_DLQ_PASS: "${RABBITMQ_DLQ_PASS:?set RABBITMQ_DLQ_PASS in .env.prod}"
      RABBITMQ_QUEUE_TYPE: "${RABBITMQ_QUEUE_TYPE:?set RABBITMQ_QUEUE_TYPE in .env.prod}"
      RABBITMQ_MESSAGE_TTL_MS: "${RABBITMQ_MESSAGE_TTL_MS:?set RABBITMQ_MESSAGE_TTL_MS in .env.prod}"
      RABBITMQ_MAX_LENGTH: "${RABBITMQ_MAX_LENGTH:?set RABBITMQ_MAX_LENGTH in .env.prod}"
      RABBITMQ_MAX_LENGTH_BYTES: "${RABBITMQ_MAX_LENGTH_BYTES:?set RABBITMQ_MAX_LENGTH_BYTES in .env.prod}"
      RABBITMQ_DELIVERY_LIMIT: "${RABBITMQ_DELIVERY_LIMIT:?set RABBITMQ_DELIVERY_LIMIT in .env.prod}"
      RABBITMQ_DLQ_MAX_LENGTH: "${RABBITMQ_DLQ_MAX_LENGTH:?set RABBITMQ_DLQ_MAX_LENGTH in .env.prod}"
      RABBITMQ_DLQ_MAX_LENGTH_BYTES: "${RABBITMQ_DLQ_MAX_LENGTH_BYTES:?set RABBITMQ_DLQ_MAX_LENGTH_BYTES in .env.prod}"
      RABBITMQ_MIGRATE_LEGACY_QUEUE_ARGUMENTS: "${RABBITMQ_MIGRATE_LEGACY_QUEUE_ARGUMENTS:-false}"

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_HOST_PORT:-19190}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"

  minio-init:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
      MINIO_API_ACCESS_KEY: "${MINIO_API_ACCESS_KEY:?set MINIO_API_ACCESS_KEY in .env.prod}"
      MINIO_API_SECRET_KEY: "${MINIO_API_SECRET_KEY:?set MINIO_API_SECRET_KEY in .env.prod}"
      MINIO_IMPORT_ACCESS_KEY: "${MINIO_IMPORT_ACCESS_KEY:?set MINIO_IMPORT_ACCESS_KEY in .env.prod}"
      MINIO_IMPORT_SECRET_KEY: "${MINIO_IMPORT_SECRET_KEY:?set MINIO_IMPORT_SECRET_KEY in .env.prod}"
      MINIO_DOWNLOAD_ACCESS_KEY: "${MINIO_DOWNLOAD_ACCESS_KEY:?set MINIO_DOWNLOAD_ACCESS_KEY in .env.prod}"
      MINIO_DOWNLOAD_SECRET_KEY: "${MINIO_DOWNLOAD_SECRET_KEY:?set MINIO_DOWNLOAD_SECRET_KEY in .env.prod}"
      MINIO_REPORT_ACCESS_KEY: "${MINIO_REPORT_ACCESS_KEY:?set MINIO_REPORT_ACCESS_KEY in .env.prod}"
      MINIO_REPORT_SECRET_KEY: "${MINIO_REPORT_SECRET_KEY:?set MINIO_REPORT_SECRET_KEY in .env.prod}"
      MINIO_ANALYSIS_ACCESS_KEY: "${MINIO_ANALYSIS_ACCESS_KEY:?set MINIO_ANALYSIS_ACCESS_KEY in .env.prod}"
      MINIO_ANALYSIS_SECRET_KEY: "${MINIO_ANALYSIS_SECRET_KEY:?set MINIO_ANALYSIS_SECRET_KEY in .env.prod}"
      MINIO_CANARY_ACCESS_KEY: "${MINIO_CANARY_ACCESS_KEY:?set MINIO_CANARY_ACCESS_KEY in .env.prod}"
      MINIO_CANARY_SECRET_KEY: "${MINIO_CANARY_SECRET_KEY:?set MINIO_CANARY_SECRET_KEY in .env.prod}"
      IMPORT_QUARANTINE_RETENTION_DAYS: "${IMPORT_QUARANTINE_RETENTION_DAYS:?set IMPORT_QUARANTINE_RETENTION_DAYS in .env.prod}"
      MINIO_BUCKET: "${MINIO_BUCKET:?set MINIO_BUCKET in .env.prod}"
