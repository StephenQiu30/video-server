name: video-server

x-prod-api-env: &prod-api-env
  APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
  ANALYSIS_ENABLED: "${ANALYSIS_ENABLED:-true}"
  DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
  RABBITMQ_URL: "${RABBITMQ_URL:?set RABBITMQ_URL in .env.prod}"
  VALKEY_URL: "${VALKEY_URL:?set VALKEY_URL in .env.prod}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.prod}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.prod}"
  AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env.prod}"
  AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:-video-server}"
  AUTH_JWT_AUDIENCE: "${AUTH_JWT_AUDIENCE:-video-web}"
  AUTH_ACCESS_COOKIE_NAME: "${AUTH_ACCESS_COOKIE_NAME:-video_access_token}"
  AUTH_REFRESH_COOKIE_NAME: "${AUTH_REFRESH_COOKIE_NAME:-video_refresh_token}"
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}"
  AUTH_REFRESH_TOKEN_TTL_SECONDS: "${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}"
  AUTH_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:?set AUTH_BOOTSTRAP_ADMIN_EMAIL in .env.prod}"
  REQUEST_FINGERPRINT_SECRET: "${REQUEST_FINGERPRINT_SECRET:?set REQUEST_FINGERPRINT_SECRET in .env.prod}"
  URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:?set URL_ENCRYPTION_KEY in .env.prod}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
  RUNNER_OPERATOR_BASE_URL: "${RUNNER_OPERATOR_BASE_URL:-}"

x-prod-worker-env: &prod-worker-env
  APP_ENV: "${APP_ENV:?set APP_ENV in .env.prod}"
  DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env.prod}"
  RABBITMQ_URL: "${RABBITMQ_URL:?set RABBITMQ_URL in .env.prod}"

x-prod-download-env: &prod-download-env
  <<: *prod-worker-env
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.prod}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.prod}"
  URL_ENCRYPTION_KEY: "${URL_ENCRYPTION_KEY:?set URL_ENCRYPTION_KEY in .env.prod}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
  RUNNER_OPERATOR_BASE_URL: "${RUNNER_OPERATOR_BASE_URL:-}"

x-prod-report-env: &prod-report-env
  <<: *prod-worker-env
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env.prod}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.prod}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.prod}"
  MINIO_BUCKET: "${MINIO_BUCKET:?set MINIO_BUCKET in .env.prod}"

x-prod-runner-env: &prod-runner-env
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:?set RUNNER_HMAC_SECRET in .env.prod}"
  RUNNER_EGRESS_PROXY: "${RUNNER_EGRESS_PROXY:?set RUNNER_EGRESS_PROXY in .env.prod}"

services:
  api:
    image: video-server:prod
    environment: *prod-api-env
    ports: !override
      - "8101:8101"

  outbox:
    image: video-server:prod
    environment: *prod-worker-env

  worker-download:
    image: video-server:prod
    environment: *prod-download-env

  worker-report:
    image: video-server:prod
    environment: *prod-report-env

  media-runner:
    image: video-server:prod
    environment: *prod-runner-env

  youtube-operator-runner:
    image: video-server:prod

  youtube-pot-provider:

  egress-proxy:

  workspace-init:
    image: video-server:prod

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env.prod}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env.prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"

  database-init:
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env.prod}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env.prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"

  rabbitmq:
    ports: !override
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env.prod}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env.prod}"

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_HOST_PORT:-19190}:9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"

  minio-init:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.prod}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.prod}"
      MINIO_BUCKET: "${MINIO_BUCKET:?set MINIO_BUCKET in .env.prod}"
