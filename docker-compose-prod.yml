name: video-server-prod

x-prod-env: &prod-env
  env_file:
    - .env.prod

services:
  api:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-api
    ports:
      - "8101:8101"

  outbox:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-outbox

  worker-download:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-worker-download

  worker-analysis:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-worker-analysis

  media-runner:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-media-runner

  egress-proxy:
    container_name: video-server-prod-egress-proxy

  workspace-init:
    <<: *prod-env
    image: video-server:prod
    container_name: video-server-prod-workspace-init

  postgres:
    <<: *prod-env
    container_name: video-server-prod-postgres

  rabbitmq:
    <<: *prod-env
    container_name: video-server-prod-rabbitmq
    hostname: video-server-prod-rabbitmq

  minio:
    <<: *prod-env
    container_name: video-server-prod-minio

  minio-init:
    <<: *prod-env
    container_name: video-server-prod-minio-init
