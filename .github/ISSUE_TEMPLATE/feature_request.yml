name: 功能建议 / Feature request
description: 提议符合 FrameFetch 产品、安全和内容授权边界的新能力
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请从真实问题和可验收结果出发描述建议。项目不会接受绕过 DRM、会员、私密、购买、地域限制或其他访问控制的能力。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue、PR 和 docs/README.md，确认没有同一提议。
          required: true
        - label: 此建议只处理用户有权使用的公开、非 DRM 内容或用户明确选择的自有文件。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景遇到什么问题？当前为什么无法完成？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户可见行为、涉及模块和最小可交付范围，避免只列技术名词。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可以客观验证的成功、失败、安全和兼容性条件。
      placeholder: |
        - [ ] 正常路径：
        - [ ] 错误与重试：
        - [ ] 安全与授权边界：
        - [ ] 文档与测试：
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括不实现此功能、使用现有工作流或缩小范围的可能性。
  - type: textarea
    id: risks
    attributes:
      label: 安全、隐私与内容授权风险
      description: 说明凭据、网络、存储、平台条款、模型输入或用户内容方面的影响；不适用时说明原因。
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 愿意提交 PR
        - 可以协助测试或提供已授权样本
        - 目前只能提供需求反馈
    validations:
      required: true
