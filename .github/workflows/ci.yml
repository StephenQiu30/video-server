name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate merge helper syntax
        run: python -m py_compile .codex/skills/land/land_watch.py

  server-quality:
    name: Server quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.7.12

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run strict type checks
        run: uv run --frozen mypy --strict src

      - name: Run coverage gate
        run: uv run --frozen pytest -q --cov=src --cov-branch --cov-fail-under=90
