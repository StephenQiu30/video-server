name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repository-check:
    name: Repository rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Repository configuration
        run: python scripts/ci.py repository
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/validate_commit_message.py --message "$PULL_REQUEST_TITLE"
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/validate_commit_message.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Validate pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: >-
          python scripts/validate_commit_message.py
          --range "${{ github.event.before }}..${{ github.sha }}"
      - name: Validate pushed diff
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: video
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -U video -d video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://video:video@127.0.0.1:5432/video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend quality gates
        run: python scripts/ci.py backend

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@11.19.0
      - name: Frontend quality gates
        run: python scripts/ci.py frontend

  runtime-smoke:
    name: Runtime boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [repository-check, backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@11.19.0
      - name: Build and verify runtime topology
        run: ./scripts/ci-runtime.sh

  required-ci:
    name: Required CI
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [repository-check, backend-quality, frontend-quality, runtime-smoke]
    steps:
      - name: Require every boundary
        env:
          REPOSITORY_RESULT: ${{ needs.repository-check.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          RUNTIME_RESULT: ${{ needs.runtime-smoke.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$RUNTIME_RESULT" = success
