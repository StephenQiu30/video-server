name: CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: video_downloader
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
        options: >-
          --health-cmd "pg_isready -U video -d video_downloader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/apps/worker:${{ github.workspace }}/packages/shared
          SKIP_DB_BOOTSTRAP: true
        run: |
          npm test
      - name: Validate Docker Compose config
        run: |
          cp .env.production.example .env.production
          npm run docker:config
          rm -f .env.production
      - name: Validate Docker Compose healthchecks
        run: bash scripts/validate_compose_healthchecks.sh .env.production.example
