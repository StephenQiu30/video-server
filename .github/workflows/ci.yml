name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test commit message rules
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/validate_commit_message.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        run: >-
          python scripts/validate_commit_message.py
          --range "${{ github.event.before }}..${{ github.sha }}"
      - name: Validate Compose modes
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose-prod.yml config --quiet
          rm -f .env .env.prod

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Strict types
        run: uv run --frozen mypy --strict app
      - name: Core tests
        run: uv run --frozen pytest -q

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and types
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Core tests
        run: npm test
      - name: Production build
        run: npm run build

  image-build:
    name: Unified image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --target runtime --tag video-server:ci .
